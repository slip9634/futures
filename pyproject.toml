[project]
name = "futures-quant"
version = "0.1.0"
description = "IBKR futures (MES/MGC/MCL) quant research, backtest, and PAPER-only forward-testing system"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "scikit-learn>=1.5",
    "pyarrow>=17.0",
    "duckdb>=1.0",
    "plotly>=5.22",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "apscheduler>=3.10",
    "tzdata>=2024.1",
    "ib_async>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/futures_quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
