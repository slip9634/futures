[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-pairs"
version = "1.0.0"
description = "Binance USDS-M perpetual pairs statistical arbitrage research"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "statsmodels>=0.14",
  "pyarrow>=16.0", "matplotlib>=3.8", "requests>=2.31", "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
