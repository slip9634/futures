# Contract reference specs. These are standard published exchange specs and
# MUST be re-confirmed against IBKR contract qualification (reqContractDetails)
# before any execution — see section 53. Do not trust this file blindly at
# trade time; it is the researched default, not a live source of truth.
#
# tick_value = tick_size * multiplier, always in `currency`.

instruments:
  MES:
    description: Micro E-mini S&P 500 Futures
    root: MES
    signal_reference: ES
    exchange: CME
    currency: USD
    multiplier: 5
    tick_size: 0.25
    tick_value: 1.25
    quarterly_months: [H, M, U, Z]   # Mar, Jun, Sep, Dec
    rth_session: {start: "09:30", end: "16:00", tz: America/New_York}
    globex_session: {start: "18:00", end: "17:00", tz: America/New_York}  # next-day close, w/ daily maint break
    maintenance_break: {start: "17:00", end: "18:00", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 5
    deliverable: false

  ES:
    description: E-mini S&P 500 Futures (signal/reference only)
    root: ES
    exchange: CME
    currency: USD
    multiplier: 50
    tick_size: 0.25
    tick_value: 12.50
    quarterly_months: [H, M, U, Z]
    rth_session: {start: "09:30", end: "16:00", tz: America/New_York}
    globex_session: {start: "18:00", end: "17:00", tz: America/New_York}
    maintenance_break: {start: "17:00", end: "18:00", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 5
    deliverable: false

  MGC:
    description: Micro Gold Futures
    root: MGC
    signal_reference: GC
    exchange: COMEX
    currency: USD
    multiplier: 10
    tick_size: 0.10
    tick_value: 1.00
    quarterly_months: [G, J, M, Q, V, Z]  # Feb, Apr, Jun, Aug, Oct, Dec (active gold cycle)
    rth_session: {start: "08:20", end: "13:30", tz: America/New_York}
    globex_session: {start: "18:00", end: "17:00", tz: America/New_York}
    maintenance_break: {start: "17:00", end: "18:00", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 5
    deliverable: true
    delivery_safety_buffer_days: 10   # NEVER hold MGC into delivery; roll/close well ahead (section 13)

  GC:
    description: COMEX Gold Futures (signal/reference only)
    root: GC
    exchange: COMEX
    currency: USD
    multiplier: 100
    tick_size: 0.10
    tick_value: 10.00
    quarterly_months: [G, J, M, Q, V, Z]
    rth_session: {start: "08:20", end: "13:30", tz: America/New_York}
    globex_session: {start: "18:00", end: "17:00", tz: America/New_York}
    maintenance_break: {start: "17:00", end: "18:00", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 5
    deliverable: true
    delivery_safety_buffer_days: 10

  MCL:
    description: Micro WTI Crude Oil Futures
    root: MCL
    signal_reference: CL
    exchange: NYMEX
    currency: USD
    multiplier: 100
    tick_size: 0.01
    tick_value: 1.00
    monthly: true   # crude trades every calendar month, not a quarterly cycle
    rth_session: {start: "09:00", end: "14:30", tz: America/New_York}
    globex_session: {start: "18:00", end: "17:00", tz: America/New_York}
    maintenance_break: {start: "17:00", end: "18:00", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 3
    deliverable: true
    delivery_safety_buffer_days: 10

  CL:
    description: NYMEX WTI Crude Oil Futures (signal/reference only)
    root: CL
    exchange: NYMEX
    currency: USD
    multiplier: 1000
    tick_size: 0.01
    tick_value: 10.00
    monthly: true
    rth_session: {start: "09:00", end: "14:30", tz: America/New_York}
    globex_session: {start: "18:00", end: "17:00", tz: America/New_York}
    maintenance_break: {start: "17:00", end: "18:00", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 3
    deliverable: true
    delivery_safety_buffer_days: 10

  MBT:
    description: CME Micro Bitcoin Futures (added for H017's crypto extension -- cash-settled, not previously an executable instrument, only used as a signal source in H012/H013)
    root: MBT
    exchange: CME
    currency: USD
    multiplier: 0.1     # 0.1 BTC per contract, cash-settled
    tick_size: 5.0
    tick_value: 0.5
    monthly: true        # CME lists near monthly expiries, not a fixed quarterly cycle
    # no traditional RTH for a near-24h cash-settled crypto future -- same window
    # used for both fields, distinct from the equity/commodity instruments above
    rth_session: {start: "18:00", end: "17:00", tz: America/New_York}
    globex_session: {start: "18:00", end: "17:00", tz: America/New_York}
    maintenance_break: {start: "17:00", end: "18:00", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 5
    deliverable: false

  SPY:
    description: SPDR S&P 500 ETF Trust (STK, not a future -- no roll rule applies; added for H017's non-futures extension) -- equity proxy for MES/ES
    root: SPY
    exchange: ARCA
    currency: USD
    multiplier: 1       # 1 share; not a futures contract multiplier
    tick_size: 0.01
    tick_value: 0.01
    # equities have no globex/maintenance-break analog -- both fields set to
    # standard NYSE/ARCA RTH as a placeholder; roll below is UNUSED (never
    # rolls) but required by the current schema, which has no non-futures
    # instrument type yet -- see H017 ledger note flagging this as tech debt
    rth_session: {start: "09:30", end: "16:00", tz: America/New_York}
    globex_session: {start: "09:30", end: "16:00", tz: America/New_York}
    maintenance_break: {start: "16:00", end: "16:01", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 36500
    deliverable: false

  GLD:
    description: SPDR Gold Shares ETF (STK, not a future -- see SPY note above) -- equity proxy for MGC/GC
    root: GLD
    exchange: ARCA
    currency: USD
    multiplier: 1
    tick_size: 0.01
    tick_value: 0.01
    rth_session: {start: "09:30", end: "16:00", tz: America/New_York}
    globex_session: {start: "09:30", end: "16:00", tz: America/New_York}
    maintenance_break: {start: "16:00", end: "16:01", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 36500
    deliverable: false

  USO:
    description: United States Oil Fund ETF (STK, not a future -- see SPY note above) -- equity proxy for MCL/CL
    root: USO
    exchange: ARCA
    currency: USD
    multiplier: 1
    tick_size: 0.01
    tick_value: 0.01
    rth_session: {start: "09:30", end: "16:00", tz: America/New_York}
    globex_session: {start: "09:30", end: "16:00", tz: America/New_York}
    maintenance_break: {start: "16:00", end: "16:01", tz: America/New_York}
    roll:
      method: volume_crossover
      fallback_days_before_expiry: 36500
    deliverable: false
